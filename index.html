<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя... <3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffd6df; /* Контрастный нежно-розовый фон */
            color: #4a3e40;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #5c4a4c;
            font-weight: 600;
        }

        .hint {
            font-size: 0.9rem;
            color: #7a6064;
            margin-bottom: 40px;
        }

        /* Банка-Кнопка: теперь это реальный тег <button>, клик по которому сработает всегда */
        .jar-btn {
            background: #ffffff;
            border: 3px solid #7a6064;
            border-radius: 40px 40px 50px 50px;
            width: 160px;
            height: 220px;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            display: block;
            outline: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            transition: transform 0.1s;
        }

        /* Крышка банки */
        .jar-btn::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 15px;
            background: #ffffff;
            border: 3px solid #7a6064;
            border-radius: 6px;
        }

        /* Эффект нажатия */
        .jar-btn:active {
            transform: scale(0.95);
        }

        /* Контейнер для бумажек внутри банки */
        .jar-papers {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 10px;
            height: 90px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-end;
            gap: 4px;
            pointer-events: none; /* Чтобы бумажки не мешали клику по кнопке */
        }

        .paper-clip {
            width: 24px;
            height: 14px;
            background: #ff8fa3;
            border: 1px solid #7a6064;
            border-radius: 3px;
            transform: rotate(var(--r));
        }

        /* Простые и надежные всплывающие окна на чистом CSS */
        .modal-back {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none;
        }

        .modal-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 320px;
            background: #ffffff;
            padding: 30px 20px 20px 20px;
            border-radius: 20px;
            border: 3px solid #7a6064;
            z-index: 101;
            display: none;
        }

        .modal-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #333333;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .cat-img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #7a6064;
            margin-bottom: 15px;
            display: none;
        }

        .close-btn {
            background: #ff8fa3;
            color: #ffffff;
            border: 2px solid #7a6064;
            padding: 12px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .close-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="main-title">Кое-что для тебя...</h1>
        <p class="hint" id="main-hint">Нажми на баночку, чтобы открыть</p>

        <!-- Теперь это полноценная кнопка -->
        <button class="jar-btn" id="jar-button" type="button">
            <div class="jar-papers" id="papers-box"></div>
        </button>
    </div>

    <!-- Окна -->
    <div class="modal-back" id="modal-bg"></div>
    <div class="modal-window" id="modal-box">
        <p class="modal-text" id="modal-txt"></p>
        <img src="" alt="Милый котик" class="cat-img" id="cat-pic">
        <button class="close-btn" id="close-button">Закрыть</button>
    </div>

    <script>
        const phrases = [
            "Твоя улыбка буквально способна спасти этот мир. Улыбнись прямо сейчас!",
            "Ты невероятно красивая, особенно когда сонная и без макияжа))",
            "Обожаю твой голос. Готов слушать твои голосовые сообщения на повторе часами",
            "В тебе сочетаются невероятный ум, доброта и капелька приятного безумия",
            "Мне очень нравится когда ты меня мило называешь, мне всегда это поднимает настроение и день уже стал лучше",
            "Извини если надоедаю тебе, просто мне с тобой комфортно",
            "Приезжай пожалуйста чаще, я знаю что это не так легко, но мне очень нравится проводить с тобой время",
            "Я хочу обниматься с тобой 24/7, хоть и сильно стесняюсь",
            "Ты самая красивая девочка в этом мире! <3"
        ];

        const catUrl = "https://unsplash.com";
        let step = 0;

        const jarButton = document.getElementById('jar-button');
        const papersBox = document.getElementById('papers-box');
        const modalBg = document.getElementById('modal-bg');
        const modalBox = document.getElementById('modal-box');
        const modalTxt = document.getElementById('modal-txt');
        const catPic = document.getElementById('cat-pic');
        const closeButton = document.getElementById('close-button');
        const mainTitle = document.getElementById('main-title');
        const mainHint = document.getElementById('main-hint');

        // Создаем бумажки внутри
        for (let i = 0; i < phrases.length; i++) {
            const paper = document.createElement('div');
            paper.classList.add('paper-clip');
            paper.style.setProperty('--r', `${Math.random() * 40 - 20}deg`);
            papersBox.appendChild(paper);
        }

        // Самая простая и безотказная функция клика
        jarButton.onclick = function() {
            if (step >= phrases.length) return;

            // Заполняем текст карточки
            modalTxt.textContent = phrases[step];

            // Если дошли до конца — включаем котика
            if (step === phrases.length - 1) {
                catPic.src = catUrl;
                catPic.style.display = 'block';
                closeButton.textContent = "Ура! 💕";
                
                mainTitle.textContent = "Баночка пуста";
                mainHint.textContent = "Но я люблю тебя всё сильнее.";
                papersBox.style.display = 'none';
            }

            // Показываем окно через прямое изменение стилей
            modalBg.style.display = 'block';
            modalBox.style.display = 'block';
        };

        // Функция закрытия
        function closeModal() {
            modalBg.style.display = 'none';
            modalBox.style.display = 'none';

            if (step < phrases.length - 1) {
                step++;
                // Убираем бумажку из банки
                if (papersBox.lastChild) {
                    papersBox.removeChild(papersBox.lastChild);
                }
            } else {
                step++;
            }
        }

        closeButton.onclick = closeModal;
        modalBg.onclick = closeModal;
    </script>
</body>
</html>
