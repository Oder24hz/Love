<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя... <3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffd6df;
            color: #4a3e40;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #5c4a4c;
            font-weight: 800; 
            letter-spacing: -0.5px;
        }

        .hint {
            font-size: 0.95rem;
            color: #7a6064;
            margin-bottom: 35px;
            font-weight: 600; 
        }

        /* Банка-Кнопка */
        .jar-btn {
            background: #ffffff;
            border: 3.5px solid #7a6064;
            border-radius: 40px 40px 50px 50px;
            width: 160px;
            height: 220px;
            position: relative;
            cursor: pointer;
            outline: none;
            box-shadow: 0 12px 24px rgba(122, 96, 100, 0.15);
            transition: transform 0.1s ease;
        }

        /* Крышка банки */
        .jar-btn::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 15px;
            background: #ffffff;
            border: 3.5px solid #7a6064;
            border-radius: 6px;
        }

        /* Эффект нажатия на баночку */
        .jar-btn:active {
            transform: scale(0.94);
        }

        /* Контейнер для бумажек внутри банки */
        .jar-papers {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 10px;
            height: 90px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-end;
            gap: 4px;
            pointer-events: none;
        }

        .paper-clip {
            width: 24px;
            height: 14px;
            background: #ff8fa3;
            border: 1.5px solid #7a6064;
            border-radius: 3px;
            transform: rotate(var(--r));
        }

        /* Задний темный фон окон */
        .modal-back {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 100;
            display: none;
            animation: fadeInBg 0.3s ease forwards;
        }

        /* Всплывающее окошко с анимацией */
        .modal-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 320px;
            background: #ffffff;
            padding: 35px 24px 24px 24px;
            border-radius: 24px;
            border: 3.5px solid #7a6064;
            z-index: 101;
            display: none;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: popUpWindow 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        /* Жирный текст записки */
        .modal-text {
            font-size: 1.15rem;
            line-height: 1.5;
            color: #2b2324;
            font-weight: 700; 
            margin-bottom: 22px;
        }

        .cat-img {
            width: 100%;
            max-height: 230px;
            object-fit: contain; /* Чтобы фото котика не обрезалось и отображалось полностью */
            border-radius: 14px;
            border: 2.5px solid #7a6064;
            margin-bottom: 18px;
            display: none;
        }

        /* Кнопка закрытия */
        .close-btn {
            background: #ff8fa3;
            color: #ffffff;
            border: 2.5px solid #7a6064;
            padding: 14px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 700; 
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #7a6064;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .close-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #7a6064;
        }

        @keyframes fadeInBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popUpWindow {
            from {
                transform: translate(-50%, -50%) scale(0.85);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="main-title">Кое-что для тебя...</h1>
        <p class="hint" id="main-hint">Нажми на баночку, чтобы открыть</p>

        <button class="jar-btn" id="jar-button" type="button">
            <div class="jar-papers" id="papers-box"></div>
        </button>
    </div>

    <div class="modal-back" id="modal-bg"></div>
    <div class="modal-window" id="modal-box">
        <p class="modal-text" id="modal-txt"></p>
        <img src="" alt="Милый котик" class="cat-img" id="cat-pic">
        <button class="close-btn" id="close-button">Закрыть</button>
    </div>

    <script>
        const phrases = [
            "Твоя улыбка буквально способна спасти этот мир. Улыбнись прямо сейчас!",
            "Ты невероятно красивая, особенно когда сонная и без макияжа))",
            "Обожаю твой голос. Готов слушать твои голосовые сообщения на повторе часами",
            "В тебе сочетаются невероятный ум, доброта и капелька приятного безумия",
            "Мне очень нравится твоя доброта ко мне",
            "Я немного волнуюсь рядом с тобой, потому что боюсь тебя разочаровать",
            "Мне безумно интересно слушать, когда ты о чем-то рассказываешь",
            "Мне очень нравится когда ты меня мило называешь, мне всегда это поднимает настроение и день уже стал лучше",
            "Извини если надоедаю тебе, просто мне с тобой комфортно",
            "Приезжай пожалуйста почаще, я знаю что это не так просто, но мне очень нравится проводить с тобой время",
            "Я хочу обниматься с тобой 24/7, хоть и сильно стесняюсь",
            "Ты самая красивая девочка в этом мире!, помни это <3"
        ];

        // Подключил твой локальный файл картинки
        const catUrl = "32d5e648d41919cd1c8c7d68cd956c86.jpg";
        let step = 0;

        const jarButton = document.getElementById('jar-button');
        const papersBox = document.getElementById('papers-box');
        const modalBg = document.getElementById('modal-bg');
        const modalBox = document.getElementById('modal-box');
        const modalTxt = document.getElementById('modal-txt');
        const catPic = document.getElementById('cat-pic');
        const closeButton = document.getElementById('close-button');
        const mainTitle = document.getElementById('main-title');
        const mainHint = document.getElementById('main-hint');

        for (let i = 0; i < phrases.length; i++) {
            const paper = document.createElement('div');
            paper.classList.add('paper-clip');
            paper.style.setProperty('--r', `${Math.random() * 40 - 20}deg`);
            papersBox.appendChild(paper);
        }

        jarButton.onclick = function() {
            if (step >= phrases.length) return;

            modalTxt.textContent = phrases[step];

            if (step === phrases.length - 1) {
                catPic.src = catUrl;
                catPic.style.display = 'block';
                closeButton.textContent = "<3";
                
                mainTitle.textContent = "Баночка пуста";
                mainHint.textContent = "Но ценю я тебя всё сильнее.";
                papersBox.style.display = 'none';
            }

            modalBg.style.display = 'block';
            modalBox.style.display = 'block';
        };

        function closeModal() {
            modalBg.style.display = 'none';
            modalBox.style.display = 'none';

            if (step < phrases.length - 1) {
                step++;
                if (papersBox.lastChild) {
                    papersBox.removeChild(papersBox.lastChild);
                }
            } else {
                step++;
            }
        }

        closeButton.onclick = closeModal;
        modalBg.onclick = closeModal;
    </script>
</body>
</html>
