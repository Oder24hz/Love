<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя... <3</title>
    <style>
        :root {
            --bg-color: #f7d6dc; /* Мягкий розовый фон, на котором банку отлично видно */
            --text-color: #4a3e40;
            --accent-pink: #ffaec1;
            --heart-color: #ff477e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #5c4a4c;
            font-weight: 500;
        }

        .hint {
            font-size: 0.85rem;
            color: #8c7376;
            margin-bottom: 40px;
        }

        /* Надежная интерактивная зона */
        .jar-wrapper {
            position: relative;
            width: 160px;
            height: 230px;
            margin: 0 auto;
            cursor: pointer;
            z-index: 10; /* Поднимаем выше всего */
        }

        /* Сама банка (теперь она полупрозрачно-белая и четко видна на розовом фоне) */
        .jar-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            border: 2px solid #ffffff;
            border-radius: 40px 40px 50px 50px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s ease;
        }

        /* Простая и надежная крышка */
        .jar-wrapper::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 16px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s ease;
        }

        /* Визуальный отклик при нажатии */
        .jar-wrapper:active .jar-body {
            transform: scale(0.95);
        }
        .jar-wrapper:active::before {
            transform: translateX(-50%) scale(0.95) translateY(2px);
        }

        /* Бумажки внутри банки */
        .jar-papers {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            height: 90px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-end;
            gap: 4px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .paper-clip {
            width: 24px;
            height: 14px;
            background: var(--accent-pink);
            border-radius: 3px;
            opacity: 0.9;
            transform: rotate(var(--r));
        }

        /* Всплывающее окно (Поп-ап) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 99;
            display: none; /* Переключаем через display для надежности */
        }

        .card-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 88%;
            max-width: 320px;
            background: #ffffff;
            padding: 30px 24px 24px 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            z-index: 100;
            display: none;
            text-align: center;
        }

        .card-text {
            font-size: 1rem;
            line-height: 1.5;
            color: #4a3e40;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .cat-frame {
            width: 100%;
            max-height: 210px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .action-btn {
            background: #fff0f2;
            color: var(--heart-color);
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* Сердечки */
        .heart-particle {
            position: fixed;
            color: var(--heart-color);
            font-size: 20px;
            pointer-events: none;
            z-index: 999;
            animation: flyUp 1s ease-out forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">Здесь кое-что для тебя</h1>
        <p class="hint" id="hint">Просто нажми на баночку</p>

        <div class="jar-wrapper" id="jar-click-zone">
            <div class="jar-body"></div>
            <div class="jar-papers" id="jar-papers-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="overlay"></div>
    <div class="card-popup" id="popup">
        <p class="card-text" id="popup-text"></p>
        <img src="" alt="Милый котик" class="cat-frame" id="cat-img">
        <button class="action-btn" id="close-btn">Закрыть</button>
    </div>

    <script>
        const phrases = [
            "Твоя улыбка буквально способна спасти этот мир. Улыбнись прямо сейчас!",
            "Ты невероятно красивая, особенно когда сонная и без макияжа))",
            "Обожаю твой голос. Готов слушать твои голосовые сообщения на повторе часами",
            "В тебе сочетаются невероятный ум, доброта и капелька приятного безумия",
            "Мне очень нравится когда ты меня мило называешь, мне всегда это поднимает настроение и день уже стал лучше",
            "Извини если надоедаю тебе, просто мне с тобой комфортно",
            "Приезжай пожалуйста чаще, я знаю что это не так легко, но мне очень нравится проводить с тобой время",
            "Я хочу обниматься с тобой 24/7, хоть и сильно стесняюсь",
            "Ты самая красивая девочка в этом мире! <3"
        ];

        const catUrl = "https://unsplash.com";
        let currentStep = 0;

        const clickZone = document.getElementById('jar-click-zone');
        const papersContainer = document.getElementById('jar-papers-container');
        const overlay = document.getElementById('overlay');
        const popup = document.getElementById('popup');
        const popupText = document.getElementById('popup-text');
        const catImg = document.getElementById('cat-img');
        const closeBtn = document.getElementById('close-btn');
        const mainTitle = document.getElementById('title');
        const mainHint = document.getElementById('hint');

        // Создание бумажек внутри банки
        for (let i = 0; i < phrases.length; i++) {
            const paper = document.createElement('div');
            paper.classList.add('paper-clip');
            paper.style.setProperty('--r', `${Math.random() * 40 - 20}deg`);
            paper.style.background = `hsl(${340 + Math.random() * 15}, 95%, ${75 + Math.random() * 10}%)`;
            papersContainer.appendChild(paper);
        }

        // Самая надежная функция обработки клика/тапа
        function openNote(e) {
            if (currentStep >= phrases.length) return;

            // Вылет сердечек строго вверх из банки (безошибочный расчет)
            const rect = clickZone.getBoundingClientRect();
            const spawnX = rect.left + rect.width / 2;
            const spawnY = rect.top + rect.height / 3;
            
            for (let i = 0; i < 5; i++) {
                spawnHeart(spawnX + (Math.random() * 40 - 20), spawnY);
            }

            // Наполнение окна текстом
            popupText.textContent = phrases[currentStep];

            if (currentStep === phrases.length - 1) {
                catImg.src = catUrl;
                catImg.style.display = 'block';
                closeBtn.textContent = "Ура! 💕";
                mainTitle.textContent = "Баночка опустела";
                mainHint.textContent = "Но мои чувства — нет.";
                papersContainer.style.opacity = '0';
            }

            // Показываем элементы
            overlay.style.display = 'block';
            popup.style.display = 'block';
        }

        // Привязываем и к мышке, и к пальцу на смартфонах
        clickZone.addEventListener('click', openNote);

        function hideModal() {
            overlay.style.display = 'none';
            popup.style.display = 'none';

            if (currentStep < phrases.length - 1) {
                currentStep++;
                if (papersContainer.lastChild) {
                    papersContainer.removeChild(papersContainer.lastChild);
                }
            } else {
                currentStep++;
            }
        }

        closeBtn.addEventListener('click', hideModal);
        overlay.addEventListener('click', hideModal);

        function spawnHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
