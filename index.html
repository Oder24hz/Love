<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя... <3</title>
    <style>
        :root {
            --bg-color: #faf5f5;
            --text-color: #4e4a4a;
            --accent-pink: #ff9ebb;
            --heart-color: #ff527b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 20% 20%, #fff0f3 0px, transparent 50%),
                radial-gradient(at 80% 40%, #ffe5ec 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 5;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #5c5556;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .hint {
            font-size: 0.85rem;
            color: #9c9294;
            margin-bottom: 40px;
        }

        /* Минималистичный и честный дизайн банки */
        .jar-wrapper {
            position: relative;
            width: 160px;
            height: 230px;
            margin: 0 auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jar-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid #e5dcdd;
            border-radius: 40px 40px 50px 50px;
            box-shadow: 0 10px 30px rgba(229, 220, 221, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: transform 0.2s ease, background-color 0.3s;
        }

        /* Крышка */
        .jar-wrapper::before {
            content: '';
            position: absolute;
            top: -10px;
            width: 100px;
            height: 16px;
            background: #f0e6e7;
            border: 2px solid #e5dcdd;
            border-radius: 6px;
            z-index: 3;
            transition: transform 0.2s ease;
        }

        /* Анимации при нажатии */
        .jar-wrapper:active .jar-body {
            transform: scale(0.96) rotate(-2deg);
            background: rgba(255, 255, 255, 0.6);
        }
        .jar-wrapper:active::before {
            transform: scale(0.96) rotate(-2deg) translateY(2px);
        }

        /* Записочки внутри банки */
        .jar-papers {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 15px;
            height: 90px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-end;
            gap: 4px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .paper-clip {
            width: 24px;
            height: 14px;
            background: var(--accent-pink);
            border-radius: 3px;
            opacity: 0.7;
            transform: rotate(var(--r));
        }

        /* Модальное окно (Поп-ап) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8c, 85, 86, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .card-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%) scale(0.95);
            width: 88%;
            max-width: 320px;
            background: #ffffff;
            padding: 30px 24px 24px 24px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(156, 146, 148, 0.15);
            border: 1px solid #f0e6e7;
            z-index: 11;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            text-align: center;
        }

        .card-popup.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .card-text {
            font-size: 1rem;
            line-height: 1.5;
            color: #4e4a4a;
            font-weight: 400;
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        .cat-frame {
            width: 100%;
            max-height: 210px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .action-btn {
            background: #fff0f3;
            color: #ff527b;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .action-btn:hover {
            background: #ffe5ec;
        }

        /* Частицы сердечек */
        .heart-particle {
            position: fixed;
            color: var(--heart-color);
            font-size: 16px;
            pointer-events: none;
            z-index: 999;
            animation: flyUp 1.4s ease-out forwards;
        }

        @keyframes flyUp {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(var(--mx), var(--my)) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
